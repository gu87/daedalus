[package]
name = "daedalusd"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
rusqlite = { version = "0.31", features = ["bundled"] }
reqwest = { version = "0.12", features = ["stream", "rustls-tls", "json"], default-features = false }
futures-util = "0.3"
bytes = "1"
async-trait = "0.1"
libc = "0.2"
serde_yaml = "0.9"
tokio-util = "0.7"
uuid = { version = "1", features = ["v4"] }
axum = "0.7"

[dev-dependencies]
tempfile = "3"
httptest = "0.16"
